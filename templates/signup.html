<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up – Reminders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow border-0 p-4" style="width: 380px;">

    <!-- Header -->
    <div class="text-center mb-4">
      <i class="bi bi-check2-square text-primary" style="font-size: 44px;"></i>
      <h4 class="fw-bold mt-2 mb-1">Create an account</h4>
      <p class="text-muted small mb-0">Start organising your reminders</p>
    </div>

    <!-- Error alert -->
    {% if error %}
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3">
        <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <!-- Form -->
    <form method="POST" action="/signup">

      <!-- Username -->
      <div class="mb-3">
        <label class="form-label fw-semibold small" for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          value="{{ username }}"
          class="form-control"
          placeholder="e.g. Name123"
          autofocus
          autocomplete="username">
        <div class="form-text">Min. 3 characters, no spaces.</div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="form-label fw-semibold small" for="password">Password</label>
        <div class="input-group">
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Min. 6 characters"
            autocomplete="new-password">
          <button type="button" class="btn btn-outline-secondary" onclick="toggleVis()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
      </div>

    </form>

    <!-- Link -->
    <p class="text-center text-muted small mt-3 mb-0">
      Already have an account?
      <a href="/login" class="text-primary fw-semibold text-decoration-none">Sign in</a>
    </p>

  </div>
</div>

<script>
function toggleVis() {
  const input = document.getElementById('password');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type     = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    input.type     = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>

</body>
</html>
