<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reminders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid vh-100 d-flex p-0">

  <!-- ── Sidebar ─────────────────────────────────────── -->
  <div class="bg-white border-end d-flex flex-column p-3" style="width: 240px; min-width: 240px;">

    <!-- User badge -->
    <div class="d-flex align-items-center gap-2 mb-3 pb-3 border-bottom">
      <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center text-white fw-bold flex-shrink-0"
           style="width: 34px; height: 34px; font-size: 14px;">
        {{ user.username[0] | upper }}
      </div>
      <span class="fw-semibold small text-truncate">{{ user.username }}</span>
    </div>

    <!-- Lists label -->
    <h6 class="text-muted text-uppercase fw-bold small mb-2">My Lists</h6>

    <!-- List buttons -->
    <div id="sidebar" class="flex-grow-1 overflow-auto"></div>

    <!-- New list -->
    <button class="btn btn-sm btn-outline-primary mt-2" onclick="createList()">
      <i class="bi bi-plus"></i> New List
    </button>

    <!-- Sign out -->
    <a href="/logout" class="btn btn-sm btn-outline-secondary mt-2">
      <i class="bi bi-box-arrow-right"></i> Sign Out
    </a>

  </div>

  <!-- ── Main Panel ───────────────────────────────────── -->
  <div class="flex-grow-1 d-flex flex-column overflow-hidden">

    <!-- Header -->
    <div class="bg-white border-bottom p-4">
      <h2 id="listTitle" class="fw-bold mb-0 text-secondary">Select a list</h2>
      <small id="listCount" class="text-muted"></small>
    </div>

    <!-- Tasks area -->
    <div class="flex-grow-1 overflow-auto p-4">
      <ul class="list-group shadow-sm" id="taskList"></ul>

      <div id="addRow" class="d-none mt-2">
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-plus-circle text-primary"></i>
          </span>
          <input id="newTask" type="text" class="form-control border-start-0"
                 placeholder="Add reminder..." onkeydown="handleEnter(event)">
          <button class="btn btn-primary" onclick="addTask()">Add</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
let activeId = null;

async function loadSidebar() {
  const data = await fetch('/lists').then(r => r.json());
  const sb   = document.getElementById('sidebar');

  sb.innerHTML = data.lists.map(l => `
    <div class="d-flex align-items-center mb-1 gap-1">
      <button onclick="selectList(${l.id})"
              class="btn btn-${activeId === l.id ? l.color : 'light'} flex-grow-1 text-start d-flex justify-content-between align-items-center">
        <span>
          <i class="bi bi-circle-fill text-${l.color} me-2" style="font-size: 10px;"></i>
          ${escHtml(l.name)}
        </span>
        ${l.pending > 0 ? `<span class="badge bg-secondary">${l.pending}</span>` : ''}
      </button>
      <button class="btn btn-sm btn-outline-secondary border-0 px-1" title="Rename"
              onclick="renameList(${l.id}, '${escAttr(l.name)}')">
        <i class="bi bi-pencil"></i>
      </button>
      <button class="btn btn-sm btn-outline-danger border-0 px-1" title="Delete"
              onclick="deleteList(${l.id}, '${escAttr(l.name)}')">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  `).join('');
}

async function selectList(id) {
  activeId = id;
  await loadSidebar();
  const list = await fetch(`/lists/${id}`).then(r => r.json());
  document.getElementById('listTitle').textContent = list.name;
  document.getElementById('listTitle').className   = `fw-bold mb-0 text-${list.color}`;
  document.getElementById('addRow').classList.remove('d-none');
  await loadTasks();
}

async function loadTasks() {
  const data  = await fetch(`/lists/${activeId}/todos`).then(r => r.json());
  const ul    = document.getElementById('taskList');
  const count = data.todos.filter(t => !t.done).length;

  document.getElementById('listCount').textContent =
    count === 0 ? 'All done!' : `${count} reminder${count !== 1 ? 's' : ''}`;

  if (data.todos.length === 0) {
    ul.innerHTML = `
      <li class="list-group-item text-center text-muted py-4">
        <i class="bi bi-check2-circle fs-3 d-block mb-2"></i>
        No reminders yet
      </li>`;
    return;
  }

  ul.innerHTML = data.todos.map(t => `
    <li class="list-group-item d-flex align-items-center gap-3">
      <input type="checkbox" class="form-check-input mt-0 flex-shrink-0"
             ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})">
      <span class="flex-grow-1 ${t.done ? 'text-decoration-line-through text-muted' : ''}">
        ${escHtml(t.title)}
      </span>
      <small class="text-muted d-none d-sm-block">${t.created_at}</small>
      <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteTask(${t.id})">
        <i class="bi bi-x-lg"></i>
      </button>
    </li>
  `).join('');
}

async function addTask() {
  const input = document.getElementById('newTask');
  const title = input.value.trim();
  if (!title || !activeId) return;
  await fetch(`/lists/${activeId}/todos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title })
  });
  input.value = '';
  await loadSidebar();
  await loadTasks();
}

function handleEnter(e) { if (e.key === 'Enter') addTask(); }

async function toggleTask(id) {
  await fetch(`/todos/${id}/toggle`, { method: 'PATCH' });
  await loadSidebar();
  await loadTasks();
}

async function deleteTask(id) {
  await fetch(`/todos/${id}`, { method: 'DELETE' });
  await loadSidebar();
  await loadTasks();
}

async function createList() {
  const name = prompt('List name:');
  if (!name || !name.trim()) return;
  const colors = ['primary','success','danger','warning','info','secondary'];
  const color  = colors[Math.floor(Math.random() * colors.length)];
  await fetch('/lists', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name.trim(), color })
  });
  await loadSidebar();
}

async function renameList(id, currentName) {
  const newName = prompt('Rename list:', currentName);
  if (!newName || !newName.trim() || newName.trim() === currentName) return;
  await fetch(`/lists/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: newName.trim() })
  });
  if (activeId === id) document.getElementById('listTitle').textContent = newName.trim();
  await loadSidebar();
}

async function deleteList(id, name) {
  if (!confirm(`Delete "${name}" and all its reminders?`)) return;
  await fetch(`/lists/${id}`, { method: 'DELETE' });
  if (activeId === id) {
    activeId = null;
    document.getElementById('listTitle').textContent = 'Select a list';
    document.getElementById('listTitle').className   = 'fw-bold mb-0 text-secondary';
    document.getElementById('listCount').textContent = '';
    document.getElementById('taskList').innerHTML    = '';
    document.getElementById('addRow').classList.add('d-none');
  }
  await loadSidebar();
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
}
function escAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

loadSidebar();
</script>
</body>
</html>
